### Other doors ###

- type: entity
  parent: BaseMaterialDoorNavMap
  id: WoodDoor
  name: wooden door
  components:
  - type: Pierceable
    level: Wood
  - type: Sprite
    # classic-start
    sprite: _Classic/Structures/Doors/mineral_doors.rsi
    snapCardinals: false
    drawdepth: Doors
    layers:
    - state: wood
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    openDrawDepth: Doors
    closedDrawDepth: Doors
    openSpriteState: wood_open
    closedSpriteState: wood
    openingSpriteState: wood
    closingSpriteState: wood_open
  - type: Occluder
    # classic-end
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Construction
    graph: DoorGraph
    node: woodDoor
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: *DamageTrigger150
      behaviors: *OverkillBehavior
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 5


- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseMaterialDoor
  name: door
  description: A door, where will it lead?
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Pierceable
    level: Metal
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Doors/MineralDoors/metal_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.12,0.5,0.12" # classic-edit
        density: 100
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    # classic-start
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
    # classic-end
    openSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
    closeSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
  - type: Appearance
  - type: Airtight
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: RCDDeconstructable
    cost: 6
    delay: 6
    fx: EffectRCDDeconstruct6
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Occluder
    # classic-start
    polygon:
    - "-0.5,-0.06"
    - "0.5,-0.06"
    - "0.5,0.06"
    - "-0.5,0.06"
    # classic-end
  - type: BlockWeather

- type: entity
  abstract: true
  parent: BaseMaterialDoor
  id: BaseMaterialDoorNavMap
  components:
  - type: NavMapDoor

### Metal doors ###

- type: entity
  parent: BaseMaterialDoorNavMap
  id: MetalDoor
  name: metal door
  components:
    # classic-start
  - type: Sprite
    sprite: _Classic/Structures/Doors/mineral_doors.rsi
    snapCardinals: false
    drawdepth: Doors
    layers:
    - state: metal
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    openDrawDepth: Doors
    closedDrawDepth: Doors
    openSpriteState: metal_open
    closedSpriteState: metal
    openingSpriteState: metal
    closingSpriteState: metal_open
  - type: Occluder
    # classic-end
  - type: Construction
    graph: DoorGraph
    node: metalDoor
  - type: Destructible
    thresholds:
    - trigger: &DamageTrigger200 # Overkill threshold
        !type:DamageTrigger
        damage: 200
      behaviors: &OverkillBehavior
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: &DamageTrigger150
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 3
            max: 5



- type: shader
  id: SelectionOutline
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#FFFFFFFF" # classic-edit
    outline_fullbright: true # classic-add
    light_boost: 2
    light_gamma: 1.5
    light_whitepoint: 48

- type: shader
  id: SelectionOutlineInrange
  # classic start
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#FFFFFFFF"
    outline_fullbright: true
    light_boost: 2
    light_gamma: 0.9
    light_whitepoint: 1

- type: shader
  id: TargetOutlineValid
  # classic end
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#00FF0055"
    light_boost: 2
    light_gamma: 0.9
    light_whitepoint: 1

# Classic start
- type: shader
  id: TargetOutlineInvalid
  kind: source
  path: "/Textures/Shaders/outline.swsl"
  params:
    outline_color: "#FF000055"
    light_boost: 2
    light_gamma: 1.5
    light_whitepoint: 48
# Classic end

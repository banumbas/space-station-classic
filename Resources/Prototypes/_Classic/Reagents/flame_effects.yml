# Reagent flame combustion properties
# Distinct tactical roles:
# - WeldingFuel: Standard reliable industrial fuel (moderate range, cheap, balanced)
# - Ethanol: High-velocity flashover jet (extreme range, low drag, quick 2.5s clean flash burn, no ash)
# - Napalm: Sticky, viscous area denial (heavy drag, 25s persistent wall of fire, clinging stacks, leaves heavy ash)
# - Plasma: Massive room-clearing cone (huge 2.2x expanding cone, high thermal shock, clean burn)
# - Phlogiston: Mythical alchemical Greek fire (emerald flame, persistent sustained burning)
# - ChlorineTrifluoride: Hyper-reactive chemical oxidizer (extreme damage, burns through everything)


- type: gameMap
  id: ClassicClassic
  mapName: 'Classic'
  mapPath: /Maps/_Classic/Stations/Colony/Colony0.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 5
  maxPlayers: 20
  stations:
    ClassicClassic:
      stationProto: StandardClassicStation
      components:
        - type: ClassicStationBiome
          biome: GrasslandsClassic
          parallax: Dirt
          undergroundLevels:
          - depth: -1
            biome: ClassicUndergroundDirtStone
            loadEntities: true
          - depth: -2
            biome: ClassicUndergroundCaves
            loadEntities: true
          - depth: -3
            biome: ClassicUndergroundMagma
            loadEntities: true
            parallax: ClassicMagma
            mapLightColor: "#48160c"
            temperature: 343.15
        - type: StationNameSetup
          mapNameTemplate: '{0} Planet {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: ClassicStationZLevels
          # MapsBelow is loaded from the deepest level toward -Z1.
          mapsBelow:
          - /Maps/_Classic/Stations/Colony/ColonyUnderground.yml # -Z3
          - /Maps/_Classic/Stations/Colony/ColonyUnderground.yml # -Z2
          - /Maps/_Classic/Stations/Colony/ColonyUnderground.yml # -Z1
          mapsAbove:
          - /Maps/_Classic/Stations/Colony/Colony1.yml
          zLevelsComponentOverrides:
            - type: MapAtmosphere
              space: False
              mixture:
                volume: 2500
                immutable: True
                temperature: 293.15
                moles:
                  Oxygen: 21.824879
                  Nitrogen: 82.10312
            - type: Parallax
              parallax: Dirt
            - type: ClassicZLevelRoof
            - type: ClassicAutoGridGravity
        - type: StationJobs
          availableJobs:
            #command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service
            Bartender: [ 1, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Lawyer: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            Reporter: [ 1, 1 ]
            #engineering
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 4, 4 ]
            #medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            MedicalIntern: [ 4, 4 ]
            Paramedic: [ 1, 1 ]
            Psychologist: [ 1, 1 ]
            Surgeon: [ 1, 1 ]
            #science
            Scientist: [ 5, 5 ]
            ResearchAssistant: [ 4, 4 ]
            #security
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 8, 10 ]
            SecurityCadet: [ 2, 2 ]
            Detective: [ 1, 1 ]
            #supply
            CargoTechnician: [ 3, 3 ]
            SalvageSpecialist: [ 2, 2 ]
            #civilian
            Assistant: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            #silicon
            Borg: [ 2, 2 ]

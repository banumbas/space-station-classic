# -Z1: earth mixed with stone (solid walls over tiles), nothing more.
- type: biomeTemplate
  id: ClassicUndergroundDirtStone
  layers:
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicDirt
      threshold: -1.0
      entities:
        - ClassicWallRock2
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
      threshold: -1.0
      entities:
        - ClassicWallRock
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: ClassicDirt
    - !type:BiomeTileLayer
      threshold: 0.15
      tile: ClassicStone
      noise:
        seed: 410
        noiseType: OpenSimplex2
        frequency: 0.018
        fractalType: FBm
        octaves: 3

# Reusable underground cave geology. New deep-level biome compositions can include this template.
- type: biomeTemplate
  id: ClassicUndergroundCaveTerrain
  layers:
    # Cave walls and props moved off the surface plains.
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicDirt
      threshold: -1.0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 0.01
      entities:
        - ClassicWallRock2
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicSand
      threshold: -1.0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 0.01
      entities:
        - ClassicWallRedRock
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicSnowDeepDeep
      threshold: -1.0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 0.01
      entities:
        - ClassicWallIcerock
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMycelium
      threshold: -1.0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 0.01
      entities:
        - ClassicWallRock2
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMyceliumLight
      threshold: -1.0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        frequency: 0.01
      entities:
        - ClassicWaterDeep
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: 0.93
      noise:
        seed: 77
        noiseType: OpenSimplex2
        frequency: 0.8
      entities:
        - FloraRockSolid
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicGrassBlood
        - ClassicGrassLightBlood
        - ClassicGrassTallBlood
      threshold: 0.55
      noise:
        seed: 42
        noiseType: OpenSimplex2
        frequency: 0.5
      entities:
        - ClassicCrystalSpawner
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicIce
        - ClassicSnow
      threshold: 0.50
      noise:
        seed: 42
        noiseType: OpenSimplex2
        frequency: 0.5
      entities:
        - ClassicCrystalIceSpawner

    # Stone is the default substrate; the old surface cave materials form regional caves.
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: ClassicStone
    - !type:BiomeTileLayer
      tile: ClassicDirt
      threshold: -0.20
      noise:
        seed: 10
        noiseType: OpenSimplex2
        frequency: 0.004
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicStone
      threshold: 0.00
      noise:
        seed: 10
        noiseType: OpenSimplex2
        frequency: 0.004
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicCobblestone
      threshold: 0.65
      noise:
        seed: 10
        noiseType: OpenSimplex2
        frequency: 0.004
        lacunarity: 2
        fractalType: FBm
        octaves: 3

    # Red caves.
    - !type:BiomeTileLayer
      tile: ClassicSand
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: 0.55
      noise:
        seed: 100
        noiseType: OpenSimplex2
        frequency: 0.01
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicGrassBlood
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
        - ClassicSand
      threshold: 0.60
      noise:
        seed: 100
        noiseType: OpenSimplex2
        frequency: 0.01
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicGrassTallBlood
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
        - ClassicSand
        - ClassicGrassBlood
      threshold: 0.70
      noise:
        seed: 100
        noiseType: OpenSimplex2
        frequency: 0.01
        lacunarity: 2
        fractalType: FBm
        octaves: 3

    # Ice caves.
    - !type:BiomeTileLayer
      tile: ClassicSnowDeepDeep
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: 0.55
      invert: true
      noise:
        seed: 100
        noiseType: OpenSimplex2
        frequency: 0.01
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicIce
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
        - ClassicSnowDeepDeep
      threshold: 0.60
      invert: true
      noise:
        seed: 100
        noiseType: OpenSimplex2
        frequency: 0.01
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicSnow
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
        - ClassicSnowDeepDeep
        - ClassicIce
      threshold: 0.70
      invert: true
      noise:
        seed: 100
        noiseType: OpenSimplex2
        frequency: 0.01
        lacunarity: 2
        fractalType: FBm
        octaves: 3

    # Water caves.
    - !type:BiomeTileLayer
      tile: ClassicDirt
      threshold: 0.80
      noise:
        seed: 300
        noiseType: OpenSimplex2
        frequency: 0.007
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicMycelium
      threshold: 0.82
      noise:
        seed: 300
        noiseType: OpenSimplex2
        frequency: 0.007
        lacunarity: 2
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicMyceliumLight
      threshold: 0.84
      noise:
        seed: 300
        noiseType: OpenSimplex2
        frequency: 0.007
        lacunarity: 2
        fractalType: FBm
        octaves: 3

# -Z2: cave terrain surrounded by solid rock walls, with deep chasms leading down to -Z3.
- type: biomeTemplate
  id: ClassicUndergroundCaves
  layers:
    # Stalagmites and loose rocks inside open caverns
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: 0.88
      noise:
        seed: 77
        noiseType: OpenSimplex2
        frequency: 0.5
      entities:
        - FloraRockSolid

    # Solid rock walls filling all non-cave space
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: -0.22
      invert: true
      noise:
        seed: 901
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2
      entities:
        - ClassicWallRock

    # Regional cave features (red caves with crystals, ice caves, mycelium)
    - !type:BiomeMetaLayer
      template: ClassicUndergroundCaveTerrain
      threshold: 0.35
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.003
        fractalType: FBm
        octaves: 3

    # Base stone substrate
    - !type:BiomeTileLayer
      tile: ClassicStone
      threshold: -1.0

    # Chasms: absence of tiles (Space) leading down to -Z3
    - !type:BiomeTileLayer
      tile: Space
      threshold: 0.84
      noise:
        seed: 902
        noiseType: OpenSimplex2
        frequency: 0.008
        fractalType: Ridged
        octaves: 2
        lacunarity: 2

# -Z3: magma biome with chasms revealing flowing magma parallax below,
# solid rock filling non-cavern space, geysers, lava pools, and glowing basalt formations.
- type: biomeTemplate
  id: ClassicUndergroundMagma
  layers:
    # Natural geyser cores where steam and heat erupt from the crust
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMagmaBasalt
      threshold: 0.988
      noise:
        seed: 1203
        frequency: 0.15
        noiseType: OpenSimplex2
      entities:
        - ClassicGeyserCore

    # Glowing surface lava pools
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMagmaBasalt
      threshold: 0.91
      noise:
        seed: 1204
        frequency: 0.08
        noiseType: OpenSimplex2
      entities:
        - FloorLavaEntity

    # Basalt stalagmites and rock formations
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMagmaBasalt
      threshold: 0.88
      noise:
        seed: 1205
        frequency: 0.4
        noiseType: OpenSimplex2
      entities:
        - FloraRockSolid

    # Glowing basalt cracks and glowing molten fissures on cavern floor
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMagmaBasalt
      threshold: 0.62
      noise:
        seed: 1202
        frequency: 0.22
        noiseType: OpenSimplex2
      entities:
        - BasaltOne
        - BasaltTwo
        - BasaltThree
        - BasaltFour
        - BasaltFive

    # Solid rock walls filling all non-cavern space
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMagmaBasalt
        - ClassicStone
      threshold: -0.22
      invert: true
      noise:
        seed: 1101
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2
      entities:
        - ClassicWallRock

    # Basalt decal details
    - !type:BiomeDecalLayer
      allowedTiles:
        - ClassicMagmaBasalt
      threshold: 0.82
      divisions: 1
      noise:
        seed: 1206
        frequency: 0.3
      decals:
        - Basalt1
        - Basalt2
        - Basalt3
        - Basalt4
        - Basalt5
        - Basalt6
        - Basalt7
        - Basalt8
        - Basalt9

    # Primary floor substrate: basalt
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: ClassicMagmaBasalt

    # Chasms: absence of tiles (Space) revealing the magma parallax beneath
    - !type:BiomeTileLayer
      tile: Space
      threshold: 0.82
      noise:
        seed: 1201
        noiseType: OpenSimplex2
        frequency: 0.009
        fractalType: Ridged
        octaves: 2
        lacunarity: 2

# Legacy alias pointing to ClassicUndergroundMagma
- type: biomeTemplate
  id: ClassicUndergroundDeep
  layers:
    - !type:BiomeMetaLayer
      template: ClassicUndergroundMagma

# -Z1: earth mixed with stone (solid walls over tiles), nothing more.
- type: biomeTemplate
  id: ClassicUndergroundDirtStone
  layers:
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicDirt
      threshold: -1.0
      entities:
        - ClassicBiomeWallDirt
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
      threshold: -1.0
      entities:
        - ClassicBiomeWallRock
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: ClassicDirt
    - !type:BiomeTileLayer
      threshold: 0.15
      tile: ClassicStone
      noise:
        seed: 410
        noiseType: OpenSimplex2
        frequency: 0.018
        fractalType: FBm
        octaves: 3


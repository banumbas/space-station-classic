# -Z2: cave terrain surrounded by solid rock walls, with deep chasms leading down to -Z3.
# Comprises 4 distinct underground environments:
# 1. Standard Stone Caves with stalagmites and rock formations
# 2. Red Rock / Bloodstone Caverns with red rock walls, sand, bloodgrass, and blood crystals
# 3. Ice Caverns with frozen ice walls, snow, ice, and ice crystals
# 4. Fungal Grotto with mycelium, glowing light mycelium, deep water pools, and dark walls
- type: biomeTemplate
  id: ClassicUndergroundCaves
  layers:
    # --- CAVERN INTERIOR PROPS & FEATURES (Evaluated in open caverns) ---
    # Standard Stone Caverns: Stalagmites and loose rocks inside open caverns
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: 0.88
      noise:
        seed: 77
        noiseType: OpenSimplex2
        frequency: 0.5
      entities:
        - FloraRockSolid

    # Red Rock Caverns: Blood crystal clusters
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicSand
        - ClassicGrassBlood
        - ClassicGrassTallBlood
      threshold: 0.60
      noise:
        seed: 42
        noiseType: OpenSimplex2
        frequency: 0.4
      entities:
        - ClassicCrystalSpawner

    # Ice Caverns: Ice crystal formations
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicSnowDeepDeep
        - ClassicIce
        - ClassicSnow
      threshold: 0.55
      noise:
        seed: 42
        noiseType: OpenSimplex2
        frequency: 0.4
      entities:
        - ClassicCrystalIceSpawner

    # Fungal Grotto: Deep water pools and fungal formations
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMycelium
        - ClassicMyceliumLight
      threshold: 0.82
      noise:
        seed: 88
        noiseType: OpenSimplex2
        frequency: 0.15
      entities:
        - ClassicWaterDeep

    # --- CAVERN WALLS (Fills all non-cavern space) ---
    # All walls share the same cave-carving noise (seed 901), so caverns flow seamlessly across biomes!
    # Standard Stone Walls
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicStone
        - ClassicCobblestone
      threshold: -0.22
      invert: true
      noise:
        seed: 901
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2
      entities:
        - ClassicBiomeWallRock

    # Red Rock Walls
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicSand
        - ClassicGrassBlood
        - ClassicGrassTallBlood
      threshold: -0.22
      invert: true
      noise:
        seed: 901
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2
      entities:
        - ClassicBiomeWallRedRock

    # Ice Rock Walls
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicSnowDeepDeep
        - ClassicIce
        - ClassicSnow
      threshold: -0.22
      invert: true
      noise:
        seed: 901
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2
      entities:
        - ClassicBiomeWallIcerock

    # Dark Rock Walls in Fungal Grotto
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicMycelium
        - ClassicMyceliumLight
      threshold: -0.22
      invert: true
      noise:
        seed: 901
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2
      entities:
        - ClassicBiomeWallRock2

    # --- TILE SUBSTRATES (Evaluated in reverse: highest index checked first) ---
    # Base default floor substrate everywhere
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: ClassicStone

    # Cobblestone patches in Stone caves
    - !type:BiomeTileLayer
      threshold: 0.35
      tile: ClassicCobblestone
      noise:
        seed: 905
        noiseType: OpenSimplex2
        frequency: 0.012
        fractalType: FBm
        octaves: 3

    # Regional: Fungal Grotto (seed 904 >= 0.22)
    - !type:BiomeTileLayer
      tile: ClassicMycelium
      threshold: 0.22
      noise:
        seed: 904
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicMyceliumLight
      threshold: 0.50
      noise:
        seed: 904
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3

    # Regional: Ice Caverns (seed 903 <= -0.22)
    - !type:BiomeTileLayer
      tile: ClassicSnowDeepDeep
      threshold: 0.22
      invert: true
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicIce
      threshold: 0.42
      invert: true
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicSnow
      threshold: 0.60
      invert: true
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3

    # Regional: Red Rock Caverns (seed 903 >= 0.22)
    - !type:BiomeTileLayer
      tile: ClassicSand
      threshold: 0.22
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicGrassBlood
      threshold: 0.48
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3
    - !type:BiomeTileLayer
      tile: ClassicGrassTallBlood
      threshold: 0.65
      noise:
        seed: 903
        noiseType: OpenSimplex2
        frequency: 0.0035
        fractalType: FBm
        octaves: 3

    # Chasms: absence of tiles (Space) leading down to -Z3
    - !type:BiomeTileLayer
      tile: Space
      threshold: 0.84
      noise:
        seed: 902
        noiseType: OpenSimplex2
        frequency: 0.008
        fractalType: Ridged
        octaves: 2
        lacunarity: 2

# -Z3: Diverse deep underworld biome with multiple regional environments:
# 1. Molten Magma Core with lava lakes and magma chasms
# 2. Ash Wastes & Obsidian Fields with Goliaths and iron/metal deposits
# 3. Crystal Abyssal Caverns glowing with quartz formations (Plasma, Uranium, Bananium, Diamond, Silver)
# 4. Bloodstone & Hellish Fissures with red rock and watchers
# 5. Geothermal Vent Fields with dense steam geysers
- type: biomeTemplate
  id: ClassicUndergroundDeepRegions
  layers:
    # --- REGION: ASH WASTES & OBSIDIAN PLAINS ---
    # Obsidian walls
    - !type:BiomeEntityLayer
      allowedTiles:
        - ClassicDirt
      threshold: -0.22
      invert: true
      noise:
        seed: 1301
        noiseType: OpenSimplex2
        frequency: 0.016
        fractalType: FBm
        octaves: 3
        lacunarity: 2

        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingShoesBootsMagPMC
        - ClothingHandsGlovesCombat
        - ClothingHeadsetPMC
        - ClothingBeltMilitaryWebbing
        - ClothingBackpackMessengerPMC
        - ClothingEyesHudPMC
        - PMCPDA
      - id: ClothingUniformJumpsuitOperativePMCBlack
        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingShoesBootsMagPMC
        - ClothingHandsGlovesCombat
        - ClothingHeadsetPMC
        - ClothingBeltMilitaryWebbing
        - ClothingBackpackMessengerPMC
        - ClothingEyesHudPMC
        - PMCPDA
    - name: Armor
      takeOne: "ClassArmor"
      entries:
      - id: ClothingOuterArmorPMC
        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingHeadHelmetPMCAssault
    - name: Weapons
      takeOne: "ClassWeapon"
      entries:
      - id: BoxPMCWeaponA
        displayEntity: WeaponShotgunBulldogPMC
        points: 0
      - id: BoxPMCWeaponB
        displayEntity: WeaponRifleARG
        points: 0
      - id: BoxPMCWeaponC
        displayEntity: WeaponRevolverProtocol
        points: 0
        stock: 1
      - id: BoxPMCWeaponD
        displayEntity: WeaponSubMachineGunUziPMC
        points: 0
        stock: 1
    - name: Ammo
      entries:
      - id: MagazinePistolSubMachineGunFMJ
        points: 2
      - id: MagazineLightRifleFMJ
        points: 3
      - id: MagazineShotgun
        points: 4
      - id: MagazineShotgunSlug
        points: 4
    - name: Medicine
      entries:
      - id: CombatMedipen
        points: 4
      - id: Stimpack
        points: 4
      - id: MedkitCombatFilled
        points: 6
      - id: HyposprayLOLPMC
        points: 12
    - name: Implants
      entries:
      - id: EmpImplanter
        points: 6
        icon: { sprite: /Textures/Objects/Magic/magicactions.rsi, state: shield }
      - id: FreedomImplanter
        points: 8
        icon: { sprite: /Textures/Actions/Implants/implants.rsi, state: freedom }
      - id: MicroBombImplanter
        points: 8
        icon: { sprite: /Textures/Actions/Implants/implants.rsi, state: explosive }
      - id: ScramImplanter
        points: 12
        icon: { sprite: /Textures/Structures/Specific/anomaly.rsi, state: anom4 }
      - id: MacroBombImplanter
        points: 20
        icon: { sprite: /Textures/Actions/Implants/implants.rsi, state: explosive }
    - name: Cybernetic
      entries:
      - id: HandImplantClaws
        points: 8
      - id: CyberEyeNightVision
        points: 8
      - id: CyberEyeThermal
        points: 12
    - name: Explosive
      entries:
      - id: EmpGrenade
        points: 2
      - id: C4
        points: 4
      - id: ToxicGasGrenade
        points: 4
      - id: ExGrenade
        points: 4
      - id: GrenadeIncendiary
        points: 4
      - id: GrenadeShrapnel
        points: 4
      - id: X4

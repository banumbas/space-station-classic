- type: entity
  parent: ClassicPointsVendorBase
  id: VendingMachinePMCAssault
  components:
  - type: Sprite
    sprite: _Classic/Structures/Machines/VendingMachines/ColMarTech/pmc.rsi
    layers:
    - state: base
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: ClassicAutomatedVendor
    pointsType: null
    userWhitelist:
      components:
      - PMCAssault
    sections:
    - name: Base Kits
      takeOne: "BaseKit"
      entries:
      - id: ClothingUniformJumpsuitOperativePMC
        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingShoesBootsMagPMC
        - ClothingHandsGlovesCombat
        - ClothingHeadsetPMC
        - ClothingBeltMilitaryWebbing
        - ClothingBackpackMessengerPMC
        - ClothingEyesHudPMC
        - PMCPDA
      - id: ClothingUniformJumpsuitOperativePMCSkirt
        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingShoesBootsMagPMC
        - ClothingHandsGlovesCombat
        - ClothingHeadsetPMC
        - ClothingBeltMilitaryWebbing
        - ClothingBackpackMessengerPMC
        - ClothingEyesHudPMC
        - PMCPDA
      - id: ClothingUniformJumpsuitOperativePMCBlack
        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingShoesBootsMagPMC
        - ClothingHandsGlovesCombat
        - ClothingHeadsetPMC
        - ClothingBeltMilitaryWebbing
        - ClothingBackpackMessengerPMC
        - ClothingEyesHudPMC
        - PMCPDA
    - name: Armor
      takeOne: "ClassArmor"
      entries:
      - id: ClothingOuterArmorPMC
        points: 0
        autoEquip: true
        autoEquipContents:
        - ClothingHeadHelmetPMCAssault
    - name: Weapons
      takeOne: "ClassWeapon"
      entries:
      - id: BoxPMCWeaponA
        points: 0
      - id: BoxPMCWeaponB
        points: 0
      - id: BoxPMCWeaponC
        points: 0
        stock: 1
      - id: BoxPMCWeaponD
        points: 0
        stock: 1
    - name: Medicine
      entries:
      - id: HyposprayLOLPMC
        points: 12


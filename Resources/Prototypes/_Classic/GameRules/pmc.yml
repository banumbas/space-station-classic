# PMC Game Rule

- type: entity
  parent: BaseNukeopsRule
  id: PMC
  components:
  - type: GameRule
    minPlayers: 20
    denyGameRules:
    - AbductorsSpawn
  - type: ClassicMergeMapRule
    mapPath: /Maps/_Classic/Nonstations/pmc_outpost.yml
    targetDepth: 1
    biomeGroundDepth: 0
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    antags:
    - !type:FixedAntagCount
      proto: PMCCommander
    - !type:FixedAntagCount
      proto: PMCMedic
    - !type:FixedAntagCount
      proto: PMCSpecialist
    - !type:LinearAntagCount
      proto: PMCAssault
      range:
        min: 1
        max: 10
      playerRatio: 20
  - type: DynamicRuleCost
    cost: 200

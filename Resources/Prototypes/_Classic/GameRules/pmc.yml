# PMC Game Rule

- type: entity
  parent: BaseGameRule
  id: PMCOutpostSpawn
  components:
  - type: LoadMapRule
    mapPath: /Maps/_Classic/Nonstations/pmc_outpost.yml

- type: entity
  parent: BaseNukeopsRule
  id: PMC
  components:
  - type: GameRule
    minPlayers: 20
    denyGameRules:
    - AbductorsSpawn
  - type: SubRule
    table: !type:GroupSelector
      children:
      - id: PMCOutpostSpawn
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ PMCCommander ]
      fallbackRoles: [ PMCAssault ]
      spawnerPrototype: SpawnPointPMCCommander
      min: 1
      max: 1
      components:
      - type: PMCCommander
      - type: ClassicVendorUser
        points: 100
      - type: NukeOperative
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-pmc-commander
      - type: NpcFactionMember
        factions: [ Syndicate ]
      mindRoles: [ MindRoleNukeopsCommander ]
      allowNonHumans: true
      tags: [ CantBecomeRevolutionary ]
    - prefRoles: [ PMCMedic ]
      fallbackRoles: [ PMCAssault ]
      spawnerPrototype: SpawnPointPMCMedic
      min: 1
      max: 1
      components:
      - type: PMCMedic
      - type: ClassicVendorUser
        points: 50
      - type: NukeOperative
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-pmc-medic
      - type: NpcFactionMember
        factions: [ Syndicate ]
      mindRoles: [ MindRoleNukeopsMedic ]
      allowNonHumans: true
      tags: [ CantBecomeRevolutionary ]
    - prefRoles: [ PMCSpecialist ]
      fallbackRoles: [ PMCAssault ]
      spawnerPrototype: SpawnPointPMCSpecialist
      min: 1
      max: 1
      components:
      - type: PMCSpecialist
      - type: ClassicVendorUser
        points: 50
      - type: NukeOperative
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-pmc-specialist
      - type: NpcFactionMember
        factions: [ Syndicate ]
      mindRoles: [ MindRoleNukeops ]
      allowNonHumans: true
      tags: [ CantBecomeRevolutionary ]
    - prefRoles: [ PMCAssault ]
      fallbackRoles: [ PMCAssault ]
      spawnerPrototype: SpawnPointPMCAssault
      min: 1
      max: 10
      playerRatio: 20
      components:
      - type: PMCAssault
      - type: ClassicVendorUser
        points: 50
      - type: NukeOperative
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-pmc-assault
      - type: NpcFactionMember
        factions: [ Syndicate ]
      mindRoles: [ MindRoleNukeops ]
      allowNonHumans: true
      tags: [ CantBecomeRevolutionary ]
  - type: DynamicRuleCost
    cost: 200

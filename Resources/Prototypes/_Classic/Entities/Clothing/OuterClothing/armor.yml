- type: entity
  parent: PowerCellSmall
  id: PowerCellPMCSpecialist
  name: PMC specialist power cell
  description: A specialized rechargeable power cell for PMC specialist armor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Battery
    maxCharge: 450
    startingCharge: 450
  - type: BatterySelfRecharger
    autoRechargeRate: 40
    autoRechargePauseTime: 5

- type: entity
  parent: ClothingOuterArmorPMC
  id: ClothingOuterArmorPMCSpecialist
  name: ent-ClothingOuterArmorPMCSpecialist
  description: ent-ClothingOuterArmorPMCSpecialist-desc
  components:
  - type: Sprite
    sprite: _Classic/Clothing/OuterClothing/Armor/pmc_reactive.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _Classic/Clothing/OuterClothing/Armor/pmc_reactive.rsi
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: ""
  - type: ToggleClothingPrefix
    prefixOn: on
    prefixOff: ""
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.55
        Radiation: 0.55
        Caustic: 0.55
  - type: ItemToggle
  - type: ToggleClothing
    action: ActionTogglePMCSpecialist
  - type: ClothingSpeedModifier
    walkModifier: 1.35
    sprintModifier: 1.35
    requireActivated: true
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellPMCSpecialist
        locked: true
  - type: ToggleCellDraw
  - type: PowerCellDraw
    drawRate: 40
  - type: ToggleArmorModifier
    activeDamageModifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
        Radiation: 0.7
        Caustic: 0.7
  - type: ClothingTrail
    trail:
      color: "#00E5FF"
      fadeColor: "#00E5FF00"
      mode: SpriteGhost
      maxPoints: 10
      minDistance: 0.4
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon-on}
          False: {state: icon}

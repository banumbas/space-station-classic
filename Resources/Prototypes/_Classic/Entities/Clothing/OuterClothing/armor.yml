  name: ent-ClothingOuterArmorPMC
  description: ent-ClothingOuterArmorPMC-desc
  components:
  - type: Sprite
    sprite: _Classic/Clothing/OuterClothing/Armor/pmc_assault.rsi
    state: icon
  - type: Clothing
    sprite: _Classic/Clothing/OuterClothing/Armor/pmc_assault.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.45 # 55% reduction
        Slash: 0.45
        Piercing: 0.45
        Heat: 0.45
        Radiation: 0.45
        Caustic: 0.45
  - type: ClothingSpeedModifier

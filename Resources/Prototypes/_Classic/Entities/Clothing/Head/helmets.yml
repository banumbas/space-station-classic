- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetPMCAssault
  name: ent-ClothingHeadHelmetPMCAssault
  description: ent-ClothingHeadHelmetPMCAssault-desc
  components:
  - type: Sprite
    sprite: _Classic/Clothing/Head/Helmet/pmc_assault.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Clothing
    sprite: _Classic/Clothing/Head/Helmet/pmc_assault.rsi
    equippedPrefix: off
  - type: ItemToggle
    activated: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
  - type: ToggleClothing
    action: ActionTogglePMCHelmet
    mustEquip: true
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 7.0
    energy: 2.5
    netsync: false
    autoRot: true
    mask: /Textures/Effects/LightMasks/cone.png
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
        shader: unshaded
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: EyeProtection
  - type: Appearance

- type: entity
  parent: ClothingHeadHelmetPMCAssault
  id: ClothingHeadHelmetPMCMedic
  name: ent-ClothingHeadHelmetPMCMedic
  description: ent-ClothingHeadHelmetPMCMedic-desc
  components:
  - type: Sprite
    sprite: _Classic/Clothing/Head/Helmet/pmc_medic.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Clothing
    sprite: _Classic/Clothing/Head/Helmet/pmc_medic.rsi


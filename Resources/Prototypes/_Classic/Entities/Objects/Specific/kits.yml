- type: entity
  id: BoxPMCWeaponCaseBase
  parent: BaseStorageItem
  name: ent-BoxPMCWeaponCaseBase
  description: ent-BoxPMCWeaponCaseBase-desc
  abstract: true
  components:
  - type: Sprite
    sprite: _Classic/Objects/Storage/guncase.rsi
    layers:
    - map: [ base ]
      state: closed
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: open }
          False: { state: closed }
  - type: Appearance
  - type: Item
    size: Ginormous
  - type: HeldSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: ContainerContainer
  - type: ItemSlots
    slots:
      slot_1:
        name: Slot 1
        whitelist:
          components:
          - Gun
          - MeleeWeapon
          - ItemToggleMeleeWeapon
          - DisarmMalus
          - OrbitalDesignator
          - CartridgeAmmo
          - Storage
          tags:
          - PMCGunCaseAllowed
          - CartridgeRocket
      slot_2:
        name: Slot 2
        whitelist:
          components:
          - Gun
          - MeleeWeapon
          - ItemToggleMeleeWeapon
          - DisarmMalus
          - OrbitalDesignator
          - CartridgeAmmo
          - Storage
          tags:
          - PMCGunCaseAllowed
          - CartridgeRocket
      slot_3:
        name: Slot 3
        whitelist:
          components:
          - Gun
          - MeleeWeapon
          - ItemToggleMeleeWeapon
          - DisarmMalus
          - OrbitalDesignator
          - CartridgeAmmo
          - Storage
          tags:
          - PMCGunCaseAllowed
          - CartridgeRocket


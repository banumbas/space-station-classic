- type: entity
  id: FlamerBackpackTankFLCS
  parent: ClothingBackpackSatchel
  name: FLCS combat backpack
  description: A specialized combat backpack system designed to carry chemical fuel cartridges and holster the FLC flamethrower.
  components:
  - type: Sprite
    sprite: _Classic/Clothing/Back/Misc/flcs.rsi
    layers:
    - state: icon
    - state: incinerator
      map: [ "incinerator" ]
      visible: false
  - type: Item
    size: Huge
    sprite: _Classic/Clothing/Back/Misc/flcs.rsi
  - type: Clothing
    sprite: _Classic/Clothing/Back/Misc/flcs.rsi
    slots:
    - Back
  - type: Storage
    grid:
    - 0,0,1,3
    - 0,0,6,3
    - 8,0,9,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      flamer_slot: !type:ContainerSlot
      tank_slot_1: !type:ContainerSlot
      tank_slot_2: !type:ContainerSlot
  - type: ItemSlots
    slots:
      flamer_slot:
        name: flamer-slot-flamer
        priority: 10
        startingItem: WeaponFlamethrowerFLC
        insertSound: /Audio/_Classic/Weapons/Guns/Flamer/wy_flamer_reload.ogg
        ejectSound: /Audio/_Classic/Weapons/Guns/Flamer/wy_flamer_unload.ogg
        whitelist:
          tags:
          - WeaponFlamethrowerFLC
      tank_slot_1:
        name: flamer-slot-tank-1
        priority: 1
        startingItem: FlamerFuelTankSmall
        insertSound: /Audio/_Classic/Weapons/Guns/Flamer/wy_flamer_reload.ogg
        ejectSound: /Audio/_Classic/Weapons/Guns/Flamer/wy_flamer_unload.ogg
        whitelist:
          tags:
          - FlamerTank
      tank_slot_2:
        name: flamer-slot-tank-2
        priority: 1
        startingItem: FlamerFuelTankSmall
        insertSound: /Audio/_Classic/Weapons/Guns/Flamer/wy_flamer_reload.ogg
        ejectSound: /Audio/_Classic/Weapons/Guns/Flamer/wy_flamer_unload.ogg
        whitelist:
          tags:
          - FlamerTank
  - type: ItemMapper
    containerWhitelist:
    - flamer_slot
    mapLayers:
      incinerator:
        whitelist:
          tags:
          - WeaponFlamethrowerFLC
  - type: Appearance
  - type: ExplosionResistance
    damageCoefficient: 0

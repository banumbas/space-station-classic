- type: entity
  id: FlamerFuelTankSmall
  parent: BaseItem
  name: flamer fuel cartridge
  description: A pressurized chemical cartridge for portable flamethrowers.
  components:
  - type: Sprite
    sprite: _Classic/Objects/Tanks/minitank.rsi
    layers:
    - state: icon
  - type: Item
    size: Large
    shape:
    - 0, 0, 1, 3
    sprite: _Classic/Objects/Tanks/minitank.rsi
  - type: Tag
    tags:
    - FlamerTank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 100
        reagents:
        - ReagentId: Napalm
          Quantity: 100
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: SolutionTransfer
    transferAmount: 25
    maxTransferAmount: 100
    minTransferAmount: 5
    canChangeTransferAmount: true
  - type: ExaminableSolution
    solution: tank
    exactVolume: true
  - type: SolutionItemStatus
    solution: tank
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: RefillReagentFilter
    reagents:
    - Napalm
    - WeldingFuel
    - Ethanol
    - Plasma
    - Phlogiston
    - ChlorineTrifluoride
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 25
    intensitySlope: 5
    maxIntensity: 3
    canCreateVacuum: false


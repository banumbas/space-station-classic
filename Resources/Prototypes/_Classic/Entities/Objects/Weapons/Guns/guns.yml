- type: entity
  parent: BaseItem
  id: WeaponRevolverProtocol
  description: Sentence takes effect immediately and is not subject to review.
  components:
  - type: Sprite
    sprite: _Classic/Objects/Weapons/Guns/syndie_revolver.rsi
    state: icon
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    slots: [ Back, suitStorage, Belt ]
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletMagnumTraceFMJ
    capacity: 15
    count: 15
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
  - type: AmmoCounter

- type: entity
  parent: BaseItem
  id: WeaponOrbitalDesignatorPMC
  components:
  - type: Item
    sprite: _Classic/Objects/Devices/binoculars.rsi
  - type: Sprite
    sprite: _Classic/Objects/Devices/binoculars.rsi
    layers:
    - state: rangefinder
    - state: laser_cas
  - type: OrbitalDesignator
    markerPrototype: PMCOrbitalMarker
    doAfterTime: 5.0
  - type: UseDelay
    delay: 300
  - type: Wieldable
    useDelayOnWield: false
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 20
    pvsIncrease: 0.5

- type: entity
  id: PMCOrbitalMarker
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    state: heavylaser_flash
    color: "#ff0000"
  - type: TriggerOnSpawn
  - type: TimerTrigger
    delay: 10
    beepInterval: 1
    beepSound:
      path: /Audio/Machines/timer.ogg
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    totalIntensity: 8000
    intensitySlope: 15
    maxIntensity: 400

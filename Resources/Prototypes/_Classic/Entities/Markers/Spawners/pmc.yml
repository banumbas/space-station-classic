# GameRule Dynamic GhostRole Spawners
- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: SpawnPointPMCCommander
  name: roles-antag-pmc-commander-name
  components:
  - type: PMCCommander
  - type: GhostRole
    name: roles-antag-pmc-commander-name
    description: roles-antag-pmc-commander-objective
    rules: ghost-role-information-pmc-rules
    important: true
    mindRoles:
    - MindRolePMCCommander
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: _Starlight/Objects/Misc/id_cards.rsi
        state: mercenary


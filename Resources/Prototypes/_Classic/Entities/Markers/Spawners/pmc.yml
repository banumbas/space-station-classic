# Map Position Markers (No GhostRoles, purely for map grid placement)
- type: entity
  id: SpawnPointPMCCommanderMarker
  parent: MarkerBase
  name: PMC Commander Spawn Point
  components:
  - type: AntagGridSpawnPoint
    whitelist:
    - PMCCommander
  - type: SpawnPoint
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: green

- type: entity
  id: SpawnPointPMCMedicMarker

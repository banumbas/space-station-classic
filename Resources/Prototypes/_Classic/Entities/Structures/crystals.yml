- type: entity
  id: ClassicCrystalIceBase
  abstract: true
  parent: ClassicCrystalBase
  name: ice crystal
  description: A freezing cold crystal of pure ice.
  components:
  - type: Sprite
    color: "#aaddff"
  - type: PointLight
    color: "#aaddff"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/glass_smash.ogg


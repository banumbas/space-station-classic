# Dense underground biomes create thousands of these walls inside ordinary PVS ranges. They are
# deliberately separate from ClassicWallRock: hand-placed/surface rocks still inherit BaseWall
# and participate in grid stability and Z-collapse. Procedural terrain grids remove
# ClassicGridStabilityComponent and these walls are permanently static + anchored, so inheriting
# Anchorable, Rotatable, GravityAffected, ClassicZPhysics, Pullable, Appearance and
# ClassicGridStabilitySupport only allocates components and runs lifecycle handlers with no
# gameplay effect.
- type: entity
  id: ClassicBiomeWallBase
  abstract: true
  name: natural wall
  suffix: planetmap, streamed
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Pierceable
    level: Metal
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Tag
    tags:
    - Structure
    - Wall
  - type: Reactive
    groups:
      Dissolvable: [ Touch ]
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: IsRoof
  - type: SpriteFade
    fadeTopOnly: true
  - type: Icon
    state: full
  - type: ClassicPerspectiveDepth
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast
  - type: Ricochetable
    chance: 0.4
  - type: Occluder
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MiningScannerViewable

- type: entity
  parent: ClassicBiomeWallBase

# Imported from the SS13 wall template set in C:\Users\sobol\Downloads\walls.
# These material variants did not have an entity in the Classic content pack, so they
# inherit the normal wall behaviour and only replace the visual resource.

- type: entity
  id: ClassicWallBamboo
  parent: WallWood
  name: bamboo wall
  components:
  - type: Sprite
    sprite: _Classic/Structures/Walls/bamboo.rsi
  - type: Icon
    sprite: _Classic/Structures/Walls/bamboo.rsi
  - type: IconSmooth
    key: walls
    base: bamboo

- type: entity
  parent: WallSolid
  id: ClassicWallIcedMetal
  name: iced metal wall
  components:
  - type: Sprite
    sprite: _Classic/Structures/Walls/iced_metal.rsi
  - type: Icon
    sprite: _Classic/Structures/Walls/iced_metal.rsi
  - type: Construction
    graph: Girder
    node: icedMetalWall
  - type: IconSmooth
    key: walls
    base: iced_metal

- type: entity
  parent: WallSolid
  id: ClassicWallIron
  name: iron wall
  components:
  - type: Sprite
    sprite: _Classic/Structures/Walls/iron.rsi
  - type: Icon
    sprite: _Classic/Structures/Walls/iron.rsi
  - type: Ricochetable
    chance: 0.7
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: Girder
    node: ironWall
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
  - type: StaticPrice
    price: 300
  - type: IconSmooth
    key: walls
    base: iron


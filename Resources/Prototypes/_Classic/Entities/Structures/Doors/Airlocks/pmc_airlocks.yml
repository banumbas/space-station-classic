# Base Black PMC Airlocks
- type: entity
  parent: Airlock
  id: AirlockPMCBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Classic/Structures/Doors/Airlocks/Standard/pmc.rsi

- type: entity
  parent: AirlockGlass
  id: AirlockPMCBaseGlass
  abstract: true
  components:
  - type: Sprite
    sprite: _Classic/Structures/Doors/Airlocks/Glass/pmc.rsi

# Solid Black PMC Airlocks
- type: entity
  parent: AirlockPMCBase
  id: AirlockPMCCommander
  name: airlock-pmc-commander
  suffix: PMC, Commander, Locked
  components:

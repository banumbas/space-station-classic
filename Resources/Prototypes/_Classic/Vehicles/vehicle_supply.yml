- type: entity
  parent: BaseStructure
  id: VehicleSupplyConsole
  categories: [ Vehicle ]
  suffix: Vehicle, Console
  name: vehicle supply console
  description: A console for ordering vehicles and their hardpoints.
  components:
  - type: Tag
    tags:
    - Vehicle
  - type: Sprite
    sprite: _Classic/Structures/Machines/asrs_console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: off
    - map: ["computerLayerScreen"]
      state: on
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ActivatableUI
    key: enum.VehicleSupplyUIKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [ [ "Cargo" ] ]
  - type: UserInterface
    interfaces:
      enum.VehicleSupplyUIKey.Key:
        type: VehicleSupplyBui
  - type: VehicleSupplyConsole
    vehicles:
    - name: humvee
      vehicle: VehicleHumvee
    - name: humvee (medical)
      vehicle: VehicleHumveeMedical
    - name: humvee (transport)
      vehicle: VehicleHumveeTransport
    - name: apc
      vehicle: VehicleAPCTracked
    - name: apc (medical)
      vehicle: VehicleAPCMed
    - name: apc (command)
      vehicle: VehicleAPCCommand
    - name: tank
      vehicle: VehicleTank
    - name: humvee (arc)
      vehicle: VehicleHumveeARC
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: Appearance
  - type: LitOnPowered
  - type: EmitSoundOnUIOpen
    sound:
      collection: VehicleKeyboardTyping
      params:
        volume: -1
  - type: InteractionOutline
  - type: RequireProjectileTarget
- type: entity
  id: VehicleLift
  categories: [ Vehicle ]
  name: vehicle lift
  suffix: Vehicle, Lift
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Tag
    tags:
    - Vehicle
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Classic/Effects/elevator.rsi
    drawdepth: LowFloors
    layers:
    - state: supply_elevator_lowered
      map: [ "vehicle-supply-lift-base" ]
  - type: Physics
    bodyType: static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.3,-2.3,2.3,2.3"
        layer:
        - MidImpassable
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 1
    blacklist:
      tags:
      - Catwalk
  - type: VehicleSupplyLift

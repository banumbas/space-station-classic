- type: entity
  parent: BaseCartridge
  id: VehicleCartridgeLTBCannon
  name: cartridge (LTB cannon)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: VehicleProjectileLTBCannon
    muzzleFlash: MuzzleFlashEffectVehicleOverLarge
    muzzleFlashOffset: 2.2, 0

- type: entity
  parent: BaseCartridge
  id: VehicleCartridgeAceAutocannon
  name: cartridge (ACE autocannon)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: VehicleProjectileAceAutocannonFlak
    muzzleFlash: MuzzleFlashEffectVehicleOver

- type: entity
  parent: BaseCartridge
  id: VehicleCartridgeDragonFlame
  name: cartridge (DRGN flame)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: VehicleProjectileDragonFlame
    muzzleFlash: MuzzleFlashEffectVehicleOver

- type: entity
  parent: BaseCartridge
  id: VehicleCartridgeTankFlamer
  name: cartridge (tank flamer)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: VehicleProjectileTankFlamer
    muzzleFlash: MuzzleFlashEffectVehicleOver

- type: entity
  parent: BaseCartridge
  id: VehicleCartridgeLTAAAP
  name: cartridge (10x20mm-APC)
  components:
  - type: CartridgeAmmo
    proto: VehicleBulletLTAAAP

# Projectiles
- type: entity
  id: VehicleLTBCannonImpact
  name: LTB cannon impact
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: DeleteOnTrigger
  - type: Explosive
    explosionType: VehicleLTBCannonExplosion
    maxIntensity: 40
    intensitySlope: 18
    totalIntensity: 650
    tileBreakScale: 4
    maxTileBreak: 12

- type: entity
  parent: BaseBullet
  id: VehicleProjectileAceAutocannonFlak
  name: ACE flak round
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Classic/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    drawdepth: Effects
    layers:
    - state: bullet
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    maxFixedRange: 32
    damage:
      types:
        Piercing: 60
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
- type: entity
  parent: BaseBullet
  id: VehicleProjectileDragonFlame
  name: DRGN flame jet
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnCollide
    fixtureID: projectile
    ignoreOtherNonHard: false
  - type: Sprite
    sprite: _Classic/Objects/Weapons/Guns/Ammunition/Projectiles/firesentry_projectile.rsi
    drawdepth: Effects
    layers:
    - state: pulse0
      shader: unshaded
  - type: Projectile
    deleteOnCollide: true
    impactEffect: null
    forceSound: true
    damage:
      types:
        Heat: 30
    soundHit: null
  - type: DeleteOnTrigger
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable

- type: entity
  parent: BaseBullet
  id: VehicleBulletLTAAAP
  name: bullet (10x20mm-APC)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
- type: entity
  parent: BaseBullet
  id: VehicleProjectileTankFlamer
  name: tank flamer jet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Classic/Objects/Weapons/Guns/Ammunition/Projectiles/firesentry_projectile.rsi
    drawdepth: Effects
    layers:
    - state: pulse0
      shader: unshaded
  - type: Projectile
    deleteOnCollide: true
    impactEffect: BulletImpactEffect
    damage:
      types:
        Heat: 22
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: DeleteOnTrigger
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable


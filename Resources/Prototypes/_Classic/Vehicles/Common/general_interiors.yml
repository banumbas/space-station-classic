- type: entity
  abstract: true
  id: VehicleInteriorGeneralBase
  categories: [ Vehicle ]
  suffix: Vehicle
  name: vehicle interior piece
  description: A decorative vehicle interior fixture.
  placement:
    mode: SnapgridCenter
  components:
  - type: Tag
    tags:
    - Vehicle
    - VehiclePart
  - type: Sprite
    sprite: _Classic/Structures/Vehicles/Interiors/general.rsi
    drawdepth: Overdoors
  - type: InteractionOutline
  - type: Clickable
- type: entity
  abstract: true
  parent: VehicleInteriorGeneralBase
  id: VehicleInteriorWallMountedBase
  name: vehicle interior wall mount
  description: A wall-mounted vehicle interior fixture.
  placement:
    mode: PlaceFree
  components:
  - type: WallMount
    arc: 360

- type: entity
  parent: VehicleInteriorWallMountedBase
  id: VehicleAmmoLoader
  suffix: Vehicle, Ammo Loader
  name: vehicle ammo loader
  description: A loader for vehicle hardpoint ammunition.
  components:
  - type: Sprite
    state: weapons_loader
  - type: Clickable
  - type: InteractionOutline
  - type: VehicleAmmoLoader

- type: entity
  parent: SurveillanceCameraGeneral
  id: VehicleInteriorCamera
  suffix: Vehicle, Camera
  name: vehicle camera
  placement:
    mode: PlaceFree
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: Structures/Wallmounts/camera.rsi
    drawdepth: Overdoors
    layers:
    - map: [ "enum.SurveillanceCameraVisualsKey.Layer" ]
      state: camera
      cycle: true
  - type: SurveillanceCameraVisuals
    sprites:
      Active: camera
      InUse: camera
      Disabled: camera

- type: entity
  parent: VehicleInteriorCamera
  id: VehicleInteriorCameraEMP
  name: vehicle camera (emp)
  components:
  - type: Sprite
    layers:
    - map: [ "enum.SurveillanceCameraVisualsKey.Layer" ]
      state: camera_emp

- type: entity
  parent: VehicleInteriorGeneralBase
  id: VehicleInvisibleWall
  name: invisible wall
  description: An invisible blocking wall for vehicle interiors that blocks vision and light.
  placement:
    mode: PlaceFree
  components:
  - type: Marker
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
    drawdepth: Overdoors

- type: entity
  parent: VehicleInteriorGeneralBase
  id: VehicleInvisibleWallNoVision
  name: invisible wall (no vision block)
  description: An invisible blocking wall for vehicle interiors that does not block vision or light.
  placement:
    mode: PlaceFree
  components:
  - type: Marker
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
  - type: Sprite
    sprite: Markers/cross.rsi
    state: blue
    drawdepth: Overdoors

- type: entity
  id: VehicleBlocker
  parent: MarkerBase
  categories: [ Vehicle ]
  name: vehicle blocker
  suffix: Vehicle, Blocker
  components:
  - type: Tag
    tags:
    - Vehicle
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
    drawdepth: Overdoors
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 100
        mask:
        - Vehicle
        layer:
        - Vehicle

- type: entity
  id: VehiclePeekAnchor
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Static
    canCollide: false

- type: entity
  id: VehicleExitArea
  categories: [ Vehicle ]
  name: vehicle exit marker
  suffix: Vehicle, Exit Marker
  description: A clickable marker used for vehicle exits.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - Vehicle
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Icon
    sprite: Markers/cross.rsi
    state: blue
  - type: VehicleExit
  - type: ClassicVehicle
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      marker:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque

- type: entity
  parent: VehicleBase
  id: VehicleVanBase
  abstract: true
  name: van
  description: A rugged transport van.
  components:
  - type: WarpPoint
    follow: true
    location: Van
  - type: GridVehicleMover
    maxSpeed: 6
    acceleration: 5
    deceleration: 12
    turnDelay: 0.25
    pushCooldown: 2
    xenoBlockMinimumSize: Immobile
    xenoPushMinimumSize: Immobile
  - type: VehicleOvercharge
    speedMultiplier: 1.6
    duration: 3
    cooldown: 15
    overchargeSound: /Audio/_Classic/Vehicle/overdrive_activate.ogg
  - type: VehicleSpotlight
    radius: 6
    energy: 2.5
    softness: 2
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _Classic/Structures/Vehicles/van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ wheels ]
      state: wheels_1
  - type: PointLight
    enabled: false
    radius: 6
    energy: 2.5
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      insertDelay: 1.5
      whitelist:
        components:
        - VehicleWheelItem
  - type: HardpointState
  - type: VehicleEnter
    interiorPath: /Maps/_Classic/Vehicles/van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    maxXenos: 2
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.5,-0.34
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1

- type: entity
  parent: VehicleVanBase
  id: VehicleVan
  suffix: Drivable, Van, Base

## CLF

- type: entity
  parent: VehicleVanBase
  id: VehicleCLFVan
  name: CLF van
  suffix: Drivable, Van, CLF
  description: A rugged transport van painted in CLF colors.
  components:
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: VehicleFrameCLFVan # CLF van modifiers
  - type: Sprite
    sprite: _Classic/Structures/Vehicles/CLF_van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_Classic/Vehicles/van_interior.yml #TODO add a dedicated CLF interior
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 10
    maxXenos: 2
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.25,0
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1


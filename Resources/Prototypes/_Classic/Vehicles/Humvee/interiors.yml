- type: entity
  abstract: true
  id: VehicleHumveeInteriorBase
  categories: [ Vehicle ]
  suffix: Vehicle, Humvee
  name: humvee interior piece
  description: A decorative interior piece for the humvee.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - Vehicle
    - VehiclePart
  - type: Sprite
    sprite: _Classic/Structures/Vehicles/Interiors/general_humvee.rsi
    drawdepth: Overdoors
- type: entity
  abstract: true
  id: VehicleHumveeChassisBase
  categories: [ Vehicle ]
  suffix: Vehicle, Humvee, Chassis
  name: humvee interior chassis
  description: A chassis segment for the humvee interior.
  placement:
    mode: PlaceFree
  components:
  - type: Tag
    tags:
    - Vehicle
    - VehiclePart
  - type: Sprite
    sprite: _Classic/Structures/Vehicles/Interiors/humvee_chassis.rsi
    drawdepth: FloorTiles
- type: entity
  parent: VehicleHumveeChassisBase
  id: VehicleHumveeChassis
  components:
  - type: Sprite
    state: humvee_chassis

- type: entity
  parent: VehicleHumveeChassisBase
  id: VehicleHumveeChassisMedical
  components:
  - type: Sprite
    state: humvee_chassis_medical

- type: entity
  parent: VehicleHumveeChassisBase
  id: VehicleHumveeChassisTransport
  components:
  - type: Sprite
    state: humvee_chassis_transport

- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeWallBase
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque
        - InteractImpassable

- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeRoofBase
  suffix: Vehicle, Humvee, Roof
  name: humvee interior roof
  description: A removable roof section for the humvee interior.
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _Classic/Structures/Vehicles/Interiors/general_humvee.rsi
    drawdepth: Overdoors
- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeDoorBase
  suffix: Vehicle, Humvee, Door
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    drawdepth: Items
  - type: Clickable
  - type: InteractionOutline
- type: entity
  abstract: true
  parent: VehicleHumveeInteriorBase
  id: VehicleHumveeWallMountedBase
  placement:
    mode: PlaceFree
  components:
  - type: WallMount
    arc: 360

- type: entity
  parent: VehicleHumveeWallMountedBase
  id: VehicleHumveeAmmoLoader
  name: humvee ammo loader
  description: A loader for humvee hardpoint ammunition.
  components:
  - type: Sprite
    state: weapons_loader
  - type: Clickable
  - type: InteractionOutline
  - type: VehicleAmmoLoader
  - type: UserInterface
    interfaces:
      enum.VehicleAmmoLoaderUiKey.Key:
        type: VehicleAmmoLoaderBoundUserInterface

- type: entity
  parent: VehicleHumveeRoofBase
  id: VehicleHumveeExitDoor
  components:
  - type: Sprite
    layers:
    - state: exit_door
      map: [ "roof" ]
  - type: Clickable
  - type: InteractionOutline
  - type: VehicleExit

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeExitDoorDirectional
  components:
  - type: Sprite
    state: exit_door1
  - type: VehicleExit

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeMedicalBackDoor1
  components:
  - type: Sprite
    state: medical_backdoor1

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeMedicalBackDoor2
  components:
  - type: Sprite
    state: medical_backdoor2

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeCarrierBackDoor1
  components:
  - type: Sprite
    state: carrier_backdoor1

- type: entity
  parent: VehicleHumveeDoorBase
  id: VehicleHumveeCarrierBackDoor2
  components:
  - type: Sprite
    state: carrier_backdoor2

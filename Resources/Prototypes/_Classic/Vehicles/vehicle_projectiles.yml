- type: entity
  parent: MuzzleFlashEffect
  id: MuzzleFlashEffectVehicleOver
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    offset: 0, 0

- type: entity
  parent: MuzzleFlashEffectVehicleOver
  id: MuzzleFlashEffectVehicleOverLarge
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    offset: 0.2, 0
    scale: "1.6, 1.6"

- type: entity
  parent: BaseBullet
  id: VehicleProjectileLTBCannon
  name: LTB cannon shell
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnCollide
    fixtureID: projectile
    ignoreOtherNonHard: false
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 12
        Piercing: 8
    maxFixedRange: 0
  - type: VehicleDamageMultiplier
    multiplier: 10
  - type: DeleteOnTrigger
  - type: ProjectileGrenade
    minVelocity: 0.5
    maxVelocity: 1.5
    fillPrototype: VehicleShrapnelJagged
    capacity: 8
  - type: Sprite
    sprite: _Classic/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    scale: "1.2, 1.2"
    layers:
    - state: ltb
      shader: unshaded

- type: entity
  parent: BaseBullet
  id: VehicleShrapnelJagged
  name: jagged shrapnel
  categories: [ HideSpawnMenu ]


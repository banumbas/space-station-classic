- type: entity
  parent: VehicleBase
  id: VehicleTankBase
  abstract: true
  name: tank
  description: A heavy armored tank built for battlefield dominance.
  components:
  - type: WarpPoint
    follow: true
    location: Tank
  - type: GridVehicleMover
    maxSpeed: 3
    acceleration: 1.154
    deceleration: 8
    maxReverseSpeed: 2
    reverseAcceleration: 1.154
    turnDelay: 1
    turnInPlace: true
    turnInPlaceMaxSpeed: 0.5
    pushCooldown: 2
    canPushVehicles: true
    blockingMobBypassNudgeLimit: 2
  - type: VehicleRideSurface
    bounds:
    - -1.3,-1.9,1.3,1.9
    climbBounds:
    - -1.8,1.8,1.8,2.8
  - type: VehicleOvercharge
    speedMultiplier: 1.3
    duration: 3
    cooldown: 20
    overchargeSound: /Audio/_Classic/Vehicle/overdrive_activate.ogg
  - type: VehicleSound
    runningSound: /Audio/Effects/Vehicle/vehicleengineidle.ogg
    runningSoundCooldown: 2
    hornSound: /Audio/Effects/Vehicle/carhorn.ogg # todo add unique tank horn
    hornCooldown: 1
    mobCollisionSound: /Audio/Effects/hit_kick.ogg
  - type: VehicleSpotlight
    radius: 8
    energy: 3
    softness: 2
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -1.2,-1.6,1.2,1.6
        density: 1500
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -1.2,-1.6,1.2,1.6
        density: 1500
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: VehicleFrameTank # tank damage modifier
  - type: Sprite
    drawdepth: Mobs
    sprite: _Classic/Structures/Vehicles/tank.rsi
    layers:
    - map: [ base ]
      state: tank_base
    - map: [ armor ]
      state: ARMOR
      visible: false
    - map: [ primary ]
      state: tank_turret_0
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ wheels ]
      state: wheels_1
  - type: PointLight
    enabled: false
    radius: 12
    energy: 3
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: VehicleHardpointVisuals
  - type: ItemSlots
    slots:
      armor:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      primary:
        startingItem: VehicleTankTurret
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      secondary:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      support:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyTank
    slots:
    - id: armor
      hardpointType: HardpointTypeArmor
      slotType: HardpointSlotTypeArmor
      visualLayer: armor
      insertDelay: 2.5
      required: false
    - id: primary
      hardpointType: HardpointTypeTurret
      slotType: HardpointSlotTypeTurret
      visualLayer: primary
      insertDelay: 3.0
      required: false
    - id: secondary
      hardpointType: HardpointTypeSecondary
      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: HardpointTypeSupport
      slotType: HardpointSlotTypeSupportAttachment
      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeTreads
      insertDelay: 2.0
  - type: VehicleEnter
    interiorPath: /Maps/_Classic/Vehicles/tank_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,-1

- type: entity
  parent: VehicleTankBase
  id: VehicleTankTest
  name: test tank (autodrive)
  description: A test tank that automatically drives east on spawn.
  suffix: Debug
  components:
  - type: VehicleAutopilot
    direction: 1,0

- type: entity
  parent: VehicleTankBase
  id: VehicleTank
  suffix: Drivable, Tank, Base, Tracked
  components:
  - type: VehicleEnter
    interiorPath: /Maps/_Classic/Vehicles/tank_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 3

    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,-1



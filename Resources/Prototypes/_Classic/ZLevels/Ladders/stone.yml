- type: entity
  id: ClassicZLevelsLadderStoneBase
  abstract: true
  name: stone ladder
  components:
  - type: Sprite
    sprite: _Classic/Structures/Architecture/Ladders/stone.rsi
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: ["Destruction"]


- type: entity
  parent:
  - ClassicZLevelLadderBase
  - ClassicZLevelsLadderStoneBase
  id: ClassicZLevelLadderStone
  components:
  - type: Construction
    graph: ClassicZLevelLadderStone
    node: ClassicZLevelLadderStone

- type: entity
  parent:
  - ClassicZLevelLadderCornerBase
  - ClassicZLevelsLadderStoneBase
  id: ClassicZLevelLadderStoneCorner
  suffix: Corner
  components:
  - type: Construction
    graph: ClassicZLevelLadderStone
    node: ClassicZLevelLadderStoneCorner

- type: entity
  parent:
  - ClassicZLevelLadderCornerInnerBase
  - ClassicZLevelsLadderStoneBase
  id: ClassicZLevelLadderStoneCornerInner
  suffix: Inner Corner
  components:
  - type: Construction
    graph: ClassicZLevelLadderStone
    node: ClassicZLevelLadderStoneCornerInner

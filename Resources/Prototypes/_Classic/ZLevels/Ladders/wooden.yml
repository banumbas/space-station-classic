- type: entity
  id: ClassicZLevelsLadderWoodenBase
  abstract: true
  name: wooden ladder
  components:
  - type: Sprite
    sprite: _Classic/Structures/Architecture/Ladders/wooden.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


- type: entity
  parent:
  - ClassicZLevelLadderBase
  - ClassicZLevelsLadderWoodenBase
  id: ClassicZLevelLadderWooden
- type: entity
  parent:
  - ClassicZLevelLadderCornerBase
  - ClassicZLevelsLadderWoodenBase
  id: ClassicZLevelLadderWoodenCorner
  suffix: Corner

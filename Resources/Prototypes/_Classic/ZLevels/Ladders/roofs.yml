- type: entity
  id: ClassicZLevelsLadderRoofBase
  name: roof tile
  description: Roof tiles, for covering building roofs.
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Red

- type: entity
  parent:
  - ClassicZLevelLadderBase
  - ClassicZLevelsLadderRoofBase
  id: ClassicZLevelsLadderRoofRed
  components:
  - type: Sprite
    sprite: _Classic/Structures/Architecture/Ladders/roof_red.rsi

- type: entity
  parent:
  - ClassicZLevelLadderCornerBase
  - ClassicZLevelsLadderRoofBase
  id: ClassicZLevelsLadderRoofRedCorner
  suffix: Corner
  components:
  - type: Sprite
    sprite: _Classic/Structures/Architecture/Ladders/roof_red.rsi

- type: entity
  parent:
  - ClassicZLevelLadderCornerInnerBase
  - ClassicZLevelsLadderRoofBase
  id: ClassicZLevelsLadderRoofRedCornerInner
  suffix: Inner Corner
  components:
  - type: Sprite
    sprite: _Classic/Structures/Architecture/Ladders/roof_red.rsi


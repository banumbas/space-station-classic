- type: entity
  id: ClassicActionZLevelUp
  name: Move up
  description: Move up one Z-Level
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Classic/Actions/misc.rsi
      state: up
  - type: InstantAction
    event: !type:ClassicZLevelActionUp

- type: entity
  id: ClassicActionZLevelDown
  name: Move down
  description: Move down one Z-Level
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Classic/Actions/misc.rsi
      state: down
  - type: InstantAction
    event: !type:ClassicZLevelActionDown

- type: entity
  parent: BaseToggleAction
  id: ClassicActionToggleLookUp
  name: Look up
  description: You lift your head and look up at the sky.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Classic/Actions/misc.rsi
      state: eye_down
    iconOn:
      sprite: _Classic/Actions/misc.rsi
      state: eye_up


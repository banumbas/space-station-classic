- type: constructionGraph
  id: BarWindowDiagonal
  start: start
  graph:
    - node: start
      edges: [] # Classic-Edit - bar diagonal windows are deconstruction-only.

    - node: barwindowdiagonal
      entity: BarWindowDiagonal
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2

    - node: baraltwindowdiagonal
      entity: BarAltWindowDiagonal
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetGlass1
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2
